name: Sync public playable build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout development source
        uses: actions/checkout@v4
        with:
          repository: shute2004/minigame
          ref: main
          path: upstream

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build QUICK-DRAW SAMURAI
        working-directory: upstream/youtube-playables/setsuna-no-migiri
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build

      - name: Copy deployable files
        run: |
          rm -rf dist
          cp upstream/youtube-playables/setsuna-no-migiri/index.html ./index.html
          cp upstream/youtube-playables/setsuna-no-migiri/styles.css ./styles.css
          cp -R upstream/youtube-playables/setsuna-no-migiri/dist ./dist
          touch .nojekyll
          rm -rf upstream

      - name: Commit synchronized build
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Sync deployable build from minigame'
          git push
